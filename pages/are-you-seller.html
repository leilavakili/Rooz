      flex-direction: column;
      text-align: right;

  <main class="relative min-h-[100vh] overflow-hidden bg-white no-scrollbar">
    <div class="pattern-bg"></div>

    <section class="seller-section relative z-10 min-h-[calc(100vh-82px)] flex items-center justify-center px-4 py-16">
      <div class="seller-card text-white">

        <h1 class="font-medium text-[28px] leading-[46px] text-right mb-9">
          چرا در روز فروشنده شوید؟
        </h1>

        <ul class="space-y-6 font-light text-[18px] leading-[148%] text-right">
          <li class="flex items-start gap-3">
            <span class="mt-[11px] w-[6px] h-[6px] rounded-full bg-white shrink-0"></span>
            <span>افزایش فروش و جذب مشتریان بیشتر</span>
          </li>

          <li class="flex items-start gap-3">
            <span class="mt-[11px] w-[6px] h-[6px] rounded-full bg-white shrink-0"></span>
            <span>دیده شدن برند شما در کنار برندهای معتبر</span>
          </li>

          <li class="flex items-start gap-3">
            <span class="mt-[11px] w-[6px] h-[6px] rounded-full bg-white shrink-0"></span>
            <span>مدیریت ساده محصولات و سفارش‌ها</span>
          </li>

          <li class="flex items-start gap-3">
            <span class="mt-[11px] w-[6px] h-[6px] rounded-full bg-white shrink-0"></span>
            <span>راه‌اندازی سریع فروشگاه آنلاین</span>
          </li>

          <li class="flex items-start gap-3">
            <span class="mt-[11px] w-[6px] h-[6px] rounded-full bg-white shrink-0"></span>
            <span>فروش ۲۴ ساعته</span>
          </li>
        </ul>

        <div class="mt-10 flex justify-start">
          <a
            href="/seller-signup"
            class="h-[40px] px-8 bg-white text-[#101010] border border-white inline-flex items-center justify-center font-light text-[14px] leading-[148%] hover:bg-black hover:text-white transition"

      </div>
