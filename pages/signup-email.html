<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ثبت نام | روز</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        .auth-input {
            height: 54px;
            border: 1px solid #D9D9D9;
            padding: 0 16px;
            font-size: 14px;
            width: 100%;
            outline: none;
            background: white;
        }

        .auth-input::placeholder {
            color: #8D8D8D;
        }

        .auth-card {
            width: 420px;
            max-width: 90%;
        }
    </style>
</head>
<body class="bg-white text-[#101010] min-h-screen flex flex-col">

<!-- HEADER -->
<header class="w-full bg-white py-3 border-b border-[#EDEDED]">
    <div class="max-w-[1600px] mx-auto px-6 flex items-center justify-between">
        <div class="flex items-center gap-4 text-xs text-gray-700">
            <span>👤</span>
            <span>👜</span>
            <span>♡</span>
            <a href="#" class="underline text-[12px]">آیا فروشنده هستید؟</a>
        </div>

        <div class="flex-1 flex justify-center">
            <input type="text" placeholder="جستجو" class="w-[400px] h-8 bg-[#F6F6F8] text-right px-3" />
        </div>

        <div class="text-xl font-bold">روز</div>
    </div>
</header>

<!-- MAIN -->
<main class="flex-1">
    <section class="relative w-full min-h-[calc(100vh-70px)] flex items-center justify-center">

        <!-- background -->
        <div class="absolute inset-0 bg-black opacity-95"></div>

        <!-- CARD -->
        <div class="relative z-10 auth-card bg-white p-8 text-center">

            <h1 class="text-[26px] font-semibold mb-6">ثبت نام در روز</h1>

            <div class="space-y-4">
                <input type="text" class="auth-input text-right" placeholder="نام و نام خانوادگی*" />
                <input type="text" class="auth-input text-right" placeholder="ایمیل یا شماره موبایل خود را وارد کنید" />
                <input type="password" class="auth-input text-right" placeholder="رمز عبور خود را بسازید" />
            </div>

            <div class="mt-3 text-[12px] text-[#6B6B6B]">
                رمز باید حداقل ۸ کاراکتر و شامل عدد و حرف باشد.
            </div>

            <div class="mt-5 text-[12px] text-[#6B6B6B] leading-6">
                ورود شما به معنای پذیرش شرایط روز و قوانین حریم خصوصی است
            </div>

            <button class="w-full h-[48px] bg-black text-white mt-6">
                ورود
            </button>

        </div>

    </section>
</main>

</body>
</html>
