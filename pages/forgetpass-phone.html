<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>بازیابی رمز عبور | روز</title>

    <link rel="icon" type="image/png" sizes="32x32" href="../app/favicon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../app/favicon.png">

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        .auth-input {
            height: 54px;
            border: 1px solid #D9D9D9;
            padding: 0 16px;
            font-size: 14px;
            width: 100%;
            outline: none;
            background: white;
        }

        .auth-input.error {
            border-color: #FF3B30;
            color: #FF3B30;
        }

        .auth-card {
            width: 420px;
            max-width: 90%;
        }
    </style>
</head>
<body class="bg-white text-[#101010] min-h-screen flex flex-col">

<!-- HEADER -->
<header class="w-full bg-white py-3 border-b border-[#EDEDED]">
    <div class="max-w-[1600px] mx-auto px-6 flex items-center justify-between">
        <div class="flex items-center gap-4 text-xs text-gray-700">
            <span>👤</span>
            <span>👜</span>
            <span>♡</span>
            <a href="#" class="underline text-[12px]">آیا فروشنده هستید؟</a>
        </div>

        <div class="flex-1 flex justify-center">
            <input type="text" placeholder="جستجو" class="w-[400px] h-8 bg-[#F6F6F8] text-right px-3" />
        </div>

        <div class="text-xl font-bold">روز</div>
    </div>
</header>

<!-- MAIN -->
<main class="flex-1">
    <section class="relative w-full min-h-[calc(100vh-70px)] flex items-center justify-center">

        <!-- background -->
        <div class="absolute inset-0 bg-black opacity-95"></div>

        <!-- CARD -->
        <div class="relative z-10 auth-card bg-white p-8 text-center">

            <h1 class="text-[26px] font-semibold mb-6">بازیابی رمز عبور</h1>

            <!-- NORMAL STATE -->
            <input type="tel" class="auth-input text-right mb-4" placeholder="شماره موبایل خود را وارد کنید" inputmode="numeric" pattern="[0-9]*" oninput="this.value = this.value.replace(/[^0-9]/g, '')" />

            <!-- ERROR STATE (use instead of above when needed) -->
            <!--
            <input type="tel" class="auth-input error text-right mb-2" value="09999999999" />
            <div class="text-[#FF3B30] text-[12px] flex items-center justify-end gap-2 mb-4">
              <span>شماره وارد شده معتبر نمیباشد</span>
              <span>⚠️</span>
            </div>
            -->

            <button class="w-full h-[48px] bg-black text-white mt-2">
                ارسال کد
            </button>

        </div>

    </section>
</main>

</body>
</html>
