<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>کد تایید | روز</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../app/favicon.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../app/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .otp-card { width: 420px; max-width: 90%; }
        .otp-input {
            height: 54px;
            border: 1px solid #D9D9D9;
            padding: 0 16px;
            font-size: 14px;
            width: 100%;
            outline: none;
            background: white;
            text-align: right;
            color: #6B7280;
        }
        .otp-input::placeholder { color: #8D8D8D; }
        .otp-input.error {
            border-color: #FF3B30;
            color: #FF3B30;
            text-align: center;
            letter-spacing: 18px;
            padding-right: 18px;
        }
        .otp-input.code {
            text-align: right;
        }
        .otp-btn { height: 56px; }
        .resend-link.disabled {
            pointer-events: none;
            color: #101010;
            text-decoration: none;
            cursor: default;
        }
        .resend-link.active {
            color: #101010;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-white text-[#101010] min-h-screen flex flex-col">
<header class="w-full bg-white py-3 border-b border-[#EDEDED]">
    <div class="max-w-[1600px] mx-auto px-6 flex items-center justify-between">
        <div class="flex items-center gap-4 text-xs text-gray-700">
            <a href="/signup" class="p-1" aria-label="user">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8.00033 7.99992C9.84127 7.99992 11.3337 6.50753 11.3337 4.66658C11.3337 2.82564 9.84127 1.33325 8.00033 1.33325C6.15938 1.33325 4.66699 2.82564 4.66699 4.66658C4.66699 6.50753 6.15938 7.99992 8.00033 7.99992Z" stroke="#101010" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.7268 14.6667C13.7268 12.0867 11.1601 10 8.0001 10C4.8401 10 2.27344 12.0867 2.27344 14.6667" stroke="#101010" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
            <button class="p-1" aria-label="bag">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M5 5.11334V4.46667C5 2.96667 6.20667 1.49334 7.70667 1.35334C9.49333 1.18001 11 2.58667 11 4.34001V5.26001" stroke="#101010" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.99988 14.6666H9.99988C12.6799 14.6666 13.1599 13.5933 13.2999 12.2866L13.7999 8.28659C13.9799 6.65992 13.5132 5.33325 10.6666 5.33325H5.33322C2.48655 5.33325 2.01988 6.65992 2.19988 8.28659L2.69988 12.2866C2.83988 13.5933 3.31988 14.6666 5.99988 14.6666Z" stroke="#101010" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="p-1" aria-label="favorites">
                <svg width="19" height="19" viewBox="0 0 19 19" fill="none"><path d="M3.50393 9.7941L9.32259 15.6547C9.42036 15.7532 9.57964 15.7532 9.67741 15.6547L15.4961 9.7941C17.0013 8.278 17.0013 5.81992 15.4961 4.30382C13.9908 2.78772 11.5503 2.78772 10.0451 4.30382L9.67741 4.67416C9.57964 4.77264 9.42036 4.77264 9.32259 4.67416L8.9549 4.30382C7.44966 2.78772 5.00918 2.78772 3.50393 4.30382C1.99869 5.81992 1.99869 8.27801 3.50393 9.7941Z" stroke="#101010"/></svg>
            </button>
            <a href="#" class="underline text-[12px]">آیا فروشنده هستید؟</a>
        </div>
        <div class="flex-1 flex justify-center">
            <input type="text" placeholder="جستجو" class="w-[400px] h-8 bg-[#F6F6F8] text-right px-3 outline-none" />
        </div>
        <div class="text-xl font-bold">روز</div>
    </div>
</header>

<main class="flex-1">
    <section class="relative w-full min-h-[calc(100vh-70px)] flex items-center justify-center">
        <div class="absolute inset-0 bg-black opacity-95"></div>
        <div class="relative z-10 otp-card bg-white p-8 text-center">
            <h1 class="text-[26px] font-semibold mb-6">کد تایید را وارد کنید</h1>

            <input id="otpInput" type="text" maxlength="6" class="otp-input code mb-5" placeholder="کد ارسال شده به شماره ۰۹۹۹۹۹۹۹۹۹۹ را وارد کنید" />

            <div id="errorBox" class="hidden text-[#FF3B30] text-[12px] items-center justify-end gap-2 mb-5">
                <span>کد ارسال شده صحیح نمی باشد</span>
                <span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM13 17H11V11H13V17ZM13 9H11V7H13V9Z" fill="#FF3B30"/>
            </svg>
          </span>
            </div>

            <div class="mb-6 text-[14px] text-[#101010] text-right">
                <a id="resendLink" href="#" class="resend-link disabled">۰:۶۰ دقیقه مانده تا دریافت مجدد کد</a>
            </div>

            <button class="otp-btn w-full bg-black text-white text-[16px]">ورود</button>
        </div>
    </section>
</main>

<script>
    const resendLink = document.getElementById('resendLink');
    const otpInput = document.getElementById('otpInput');
    const errorBox = document.getElementById('errorBox');

    let remaining = 60;
    let timer = null;

    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins}:${String(secs).padStart(2, '0')}`;
    }

    function renderCountdown() {
        if (remaining > 0) {
            resendLink.textContent = `${formatTime(remaining)} دقیقه مانده تا دریافت مجدد کد`;
            resendLink.classList.remove('active');
            resendLink.classList.add('disabled');
        } else {
            resendLink.textContent = 'دریافت مجدد کد';
            resendLink.classList.remove('disabled');
            resendLink.classList.add('active');
        }
    }

    function startCountdown() {
        remaining = 60;
        renderCountdown();
        clearInterval(timer);
        timer = setInterval(() => {
            remaining -= 1;
            renderCountdown();
            if (remaining <= 0) {
                clearInterval(timer);
            }
        }, 1000);
    }

    resendLink.addEventListener('click', (e) => {
        e.preventDefault();
        if (remaining > 0) return;
        otpInput.value = '';
        otpInput.classList.remove('error');
        otpInput.classList.add('code');
        otpInput.placeholder = 'کد ارسال شده به شماره ۰۹۹۹۹۹۹۹۹۹۹ را وارد کنید';
        errorBox.classList.add('hidden');
        startCountdown();
    });

    // Demo error state trigger: if user enters less than 4 chars and blurs, show error layout.
    otpInput.addEventListener('blur', () => {
        if (otpInput.value.trim() && otpInput.value.trim().length < 4) {
            otpInput.classList.remove('code');
            otpInput.classList.add('error');
            errorBox.classList.remove('hidden');
            errorBox.classList.add('flex');
        }
    });

    otpInput.addEventListener('input', () => {
        if (otpInput.classList.contains('error') && otpInput.value.trim().length >= 4) {
            otpInput.classList.remove('error');
            otpInput.classList.add('code');
            errorBox.classList.add('hidden');
            errorBox.classList.remove('flex');
        }
    });

    startCountdown();
</script>
</body>
</html>
