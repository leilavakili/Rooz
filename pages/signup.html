<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ثبت نام | روز</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../public/src/css/style.css">

    <style>
        .container-custom { max-width: 1600px; }

        .auth-input {
            height: 54px;
            border: 1px solid #D9D9D9;
            padding: 0 16px;
            font-size: 14px;
            width: 100%;
            outline: none;
            background: white;
        }

        .auth-input::placeholder {
            color: #8D8D8D;
        }

        .auth-card {
            width: 420px;
            max-width: 90%;
        }
    </style>
</head>
<body class="bg-white text-[#101010] min-h-screen flex flex-col">

<!-- HEADER -->
<header class="w-full bg-white py-3 border-b border-[#EDEDED]">
    <div class="container-custom mx-auto px-6">
        <div class="flex items-center justify-between">

            <!-- left icons -->
            <div class="flex items-center gap-4 text-xs text-gray-700">
                <button class="p-1">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 8C9.8 8 11.3 6.5 11.3 4.6C11.3 2.8 9.8 1.3 8 1.3C6.1 1.3 4.6 2.8 4.6 4.6C4.6 6.5 6.1 8 8 8Z" stroke="#101010"/></svg>
                </button>
                <button class="p-1">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M5 5V4.4C5 3 6.2 1.5 7.7 1.3" stroke="#101010"/></svg>
                </button>
                <button class="p-1">
                    <svg width="18" height="18" viewBox="0 0 19 19" fill="none"><path d="M3.5 9.7L9.3 15.6L15.5 9.7" stroke="#101010"/></svg>
                </button>
                <a href="#" class="underline text-[12px]">آیا فروشنده هستید؟</a>
            </div>

            <!-- search -->
            <div class="flex-1 flex justify-center">
                <div class="flex items-center w-full max-w-[400px] h-8 bg-[#F6F6F8] px-3">
                    <input type="text" placeholder="جستجو" class="flex-1 bg-transparent outline-none text-sm text-right" />
                </div>
            </div>

            <!-- logo -->
            <div class="text-xl font-bold">روز</div>

        </div>
    </div>
</header>

<!-- MAIN -->
<main class="flex-1">
    <section class="relative w-full min-h-[calc(100vh-70px)] flex items-center justify-center">

        <!-- background pattern -->
        <div class="absolute inset-0 bg-black opacity-95"></div>

        <!-- content -->
        <div class="relative z-10 auth-card bg-white p-8 text-center">

            <h1 class="text-[24px] md:text-[28px] font-semibold mb-6">ثبت نام در روز</h1>

            <div class="space-y-4">
                <input type="text" class="auth-input text-right" placeholder="نام و نام خانوادگی*" />
                <input type="text" class="auth-input text-right" placeholder="ایمیل یا شماره موبایل خود را وارد کنید" />
                <input type="text" class="auth-input text-right" placeholder="تاریخ تولد (اختیاری)" />
            </div>

            <div class="mt-5 text-[12px] text-[#6B6B6B] leading-6">
                برای داشتن یک تجربه ویژه در روز، تولدتون.<br>
                ورود شما به معنای پذیرش شرایط روز و قوانین حریم خصوصی است
            </div>

            <button class="w-full h-[48px] bg-black text-white text-sm mt-6">
                ورود
            </button>

        </div>

    </section>
</main>

</body>
</html>
